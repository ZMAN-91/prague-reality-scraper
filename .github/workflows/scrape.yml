name: Hourly sale scrape

on:
  schedule:
    # Every hour, except the window the weekly rent pass owns.
    #
    # Rent runs Sundays 00:00-04:00 UTC (02:00-06:00 Prague) and needs the
    # whole of it. Sale runs are kept out rather than queued behind it: the
    # two share a concurrency group, so queueing would pile four hours of
    # sale runs into a heap that all fire at once the moment rent finishes,
    # collecting the same hour four times over.
    #
    # Sunday resumes at 05:37 UTC - well after rent's budget ends - so a
    # rent pass that uses every minute it has still finishes first.
    #
    # Four attempts an hour, for one run an hour.
    #
    # GitHub's schedule event is best effort and drops most of them: asking
    # for 24 runs a day at minute 0 got three (13:17, 18:01, 21:58 UTC), and
    # moving to minute 37 got none at all overnight. Nothing about the cron
    # expression fixes that, so the answer is to ask more often and throw
    # away what is not needed - the `guard` job below starts a scrape only
    # when the last real one is over MIN_GAP_MINUTES old and nothing is
    # running now.
    #
    # The portals see the same one sweep an hour either way. What changes is
    # only how many chances GitHub has to deliver it.
    - cron: "*/15 * * * 1-6"
    - cron: "*/15 5-23 * * 0"
  workflow_dispatch:
    inputs:
      transactions:
        # Sale only. Rent has its own weekly workflow (scrape-rent.yml) and a
        # different scope, so the two never share a run.
        description: "Transaction types (prodej / pronajem)"
        required: false
        default: "prodej"
      sources:
        # Order matters and is deliberate: sreality first (the watched area,
        # ~35 requests), then iDNES (a few hundred), then bezrealitky, which
        # is by far the largest and therefore the one that should be the one
        # cut short when the hour runs out. Sources are run in the order given.
        description: "Comma-separated sources to run, in the order they run"
        required: false
        default: "sreality,idnes,bezrealitky"
      max_seconds:
        # 40 minutes, and the headroom is the point, not caution.
        #
        # The schedule fires hourly and the concurrency group serialises runs
        # rather than overlapping them, so any run that regularly exceeds the
        # hour does not just finish late - it pushes the next one back, which
        # pushes the one after that, and the queue never recovers. A run has
        # to fit inside its hour with room for the job's other work
        # (dependencies, the test suite, the CSV export, the commit).
        #
        # Measured, at one request a second: bezrealitky's Prague set is 1727
        # listings (~29 min), sreality's watched area ~35 requests (~1 min),
        # iDNES a few hundred (~4 min). About 34 minutes of fetching, so 40
        # is a real budget with real slack - not a number that merely fits.
        description: "Wall-clock budget for fetching (seconds)"
        required: false
        default: "2400"
      notify_on_success:
        # See the "Announce a successful run" step: a success opens an issue
        # only when none is already open, so this input exists to silence
        # even that for a one-off run.
        description: "Set to false to stay quiet even if no confirmation issue is open"
        required: false
        default: "true"
      max_new_details:
        description: "Cap on one-time detail fetches for newly-seen listings"
        required: false
        default: "400"
      as_schedule:
        # Set this whenever something OTHER THAN A PERSON presses the button.
        #
        # A hand-triggered run skips the guard entirely, on the reasoning that
        # a person who pressed the button wants a run. An external waker is
        # not a person: it fires every fifteen minutes, and without this it
        # would put four sweeps an hour through the portals instead of one.
        # With it the guard rations the waker exactly as it rations the cron.
        #
        # The Cloudflare Worker that wakes this workflow sets it - GitHub's
        # own scheduler delivered 4 of ~150 attempts over two days, so the
        # waker is what actually keeps the collection running. It also makes
        # the API branch provable on demand, which is why it was added.
        description: "Rate-limit this run through the guard (external wakers set this)"
        required: false
        default: "false"

permissions:
  contents: write
  # Only for the success notification below; nothing else in this workflow
  # touches issues.
  issues: write
  # The guard job reads this repository's own run history.
  actions: read

jobs:
  guard:
    # Deliberately OUTSIDE the scrape-data concurrency group. This job has to
    # be able to run and say "no" while a scrape is in progress; inside the
    # group it would queue behind that scrape and then wake to find the coast
    # clear, which is the pile-up it exists to prevent.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Decide whether this attempt should scrape
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.as_schedule == 'true') && 'schedule' || github.event_name }}
          # How old the last real run must be before another one starts.
          # Fifty, not sixty: attempts land every fifteen minutes, so a
          # sixty-minute floor would push each run to the attempt after the
          # hour and drift the cadence later every time.
          MIN_GAP_MINUTES: "50"
          # Below this a "run" was this guard saying no, not a sweep. See
          # tools/scrape_guard.sh - getting this wrong stops the collection
          # silently and forever.
          MIN_REAL_RUN_SECONDS: "300"
        # The logic lives in a script because inline YAML shell cannot be
        # tested, and this decides whether the project collects anything at
        # all. tests/test_scrape_guard.py covers it.
        run: tools/scrape_guard.sh >> "$GITHUB_OUTPUT"

  scrape:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Never let two runs write/commit concurrently - a scrape can occasionally
    # run long, and two overlapping runs both writing listings.csv would race.
    # One group for BOTH workflows: the weekly rent run writes the same file.
    # The guard above means this is now only a backstop against a race
    # between two guards deciding at once, not the everyday mechanism.
    concurrency:
      group: scrape-data
      cancel-in-progress: false
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Checkout the dataset
        # The data lives in a private repository so it is never published;
        # the code lives here so the Actions minutes are free. A deploy key
        # with write access joins the two - see docs/rozdeleni.md.
        uses: actions/checkout@v4
        with:
          repository: ZMAN-91/prague_reality_sector_analysis
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          ref: claude/real-estate-market-scraper-1tgiei
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # A scraper that writes to a committed dataset should not run at all
        # if its own parsing/merging logic is broken - the tests are offline
        # and take under a second.
        run: python -m pytest -q

      - name: Run scraper
        id: scrape
        # Never let a non-zero exit skip the commit step below: whatever
        # data/log output run.py produced before failing must still be
        # persisted. The job is still failed deliberately at the end (see
        # "Fail job if scrape reported errors").
        continue-on-error: true
        env:
          SOURCES: ${{ github.event.inputs.sources || 'sreality,idnes,bezrealitky' }}
          MAX_SECONDS: ${{ github.event.inputs.max_seconds || '2400' }}
          MAX_NEW_DETAILS: ${{ github.event.inputs.max_new_details || '400' }}
          TRANSACTIONS: ${{ github.event.inputs.transactions || 'prodej' }}
          # ------------------------------------------------------------------
          # THE ONE PLACE where this project stops treating a robots.txt as
          # binding. Delete this line and strict compliance returns everywhere.
          #
          # Why only sreality: bezrealitky publishes a sitemap and permits its
          # listing detail pages, so it is collected entirely through the route
          # the site itself offers - no override needed, and none given. Its
          # GraphQL host (api.bezrealitky.cz, "Disallow: /") is not touched.
          #
          # Reality.iDNES.cz needs no override either: "Allow: /" with only
          # search-filter URL shapes disallowed, and VOP that are advertiser
          # billing terms. Realingo and CeskeReality are deliberately NOT
          # collected - realingo's terms forbid crawlers and scraping by
          # name, CeskeReality's robots.txt is "Disallow: /" - so the only
          # source this project overrides remains the one below.
          #
          # sreality has no such route: its robots.txt is "Disallow: /" for
          # every agent that is not one of eighteen named search engines, so
          # there is no compliant automated path to the data at all. This is an
          # informed operator decision for personal, non-commercial market
          # tracking with no redistribution, and it is paired with a footprint
          # deliberately kept near a person's: an honest self-identifying
          # User-Agent (no browser impersonation), 1-2s between requests, each
          # listing's detail fetched once ever, and - the big one - reading the
          # search index rather than one request per listing, which is the
          # difference between ~30 requests an hour and ~12,000.
          # See docs/robots/www.sreality.cz.robots.txt for the exact text.
          SCRAPER_ROBOTS_OVERRIDE_HOSTS: "www.sreality.cz"
        run: |
          python run.py \
            --sources "$SOURCES" \
            --max-seconds "$MAX_SECONDS" \
            --max-new-details "$MAX_NEW_DETAILS" \
            --transactions "$TRANSACTIONS" \
            --data-dir store/data \
            --logs-dir store/logs

      - name: Export human-readable CSV views
        # Cheap, offline, and makes the dataset browsable straight from the
        # repo without loading the full listings.csv.
        continue-on-error: true
        run: |
          python -m tools.export_csv --data-dir store/data
          python -m tools.episodes --data-dir store/data
          python -m tools.market --data-dir store/data

      - name: Commit and push data changes
        # The whole sequence lives in tools/commit_data.sh, which both
        # workflows call and tests/test_commit_step.py exercises against real
        # git repositories. It was inline and identical in both files, which
        # is how a bug that reverts code pushes survived in two places at
        # once. The script's header explains the two rules it enforces.
        env:
          DATA_ROOT: store
        run: bash tools/commit_data.sh "claude/real-estate-market-scraper-1tgiei" "Scrape run"

      - name: Announce a successful run
        # GitHub emails you when a workflow FAILS; there is no built-in
        # notification for one that worked. So a successful run announces
        # itself by opening an issue, which the repository owner watches by
        # default and therefore receives by email.
        #
        # At most one such issue is open at a time. That is what keeps an
        # hourly schedule from becoming an hourly inbox: the first successful
        # run opens one, every run after that sees it and stays quiet. Close
        # the issue and the next success opens a fresh one - which is also
        # how you ask for another confirmation later.
        #
        # `notify_on_success: false` on a manual run suppresses it entirely.
        if: steps.scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY: ${{ github.event.inputs.notify_on_success }}
          LABEL: scrape-ok
        run: |
          set -euo pipefail

          if [ "${NOTIFY:-}" = "false" ]; then
            echo "notify_on_success=false for this run; staying quiet."
            exit 0
          fi
          # Create the label first: `gh issue list --label` errors on a label
          # that does not exist, and under `set -e` that would fail the job
          # over a notification. Both calls are allowed to fail softly - a
          # missing confirmation must never turn a good run into a bad one.
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" \
            --description "Confirmation that a scrape run succeeded" \
            --color 0e8a16 >/dev/null 2>&1 || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --label "$LABEL" --limit 1 --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$OPEN" != "0" ]; then
            echo "A confirmation issue is already open; not opening another."
            exit 0
          fi

          # The numbers come from the run's own log, so the email says what
          # was collected rather than just that something happened.
          SUMMARY=$(python - <<'PY'
          import glob, json
          # store/, not logs/: the dataset is checked out into a
          # subdirectory now. Reading the old path found nothing and the
          # notification quietly said "No run log was written" - a green run
          # announcing itself with no numbers in it, which is exactly the
          # kind of half-working that survives because nobody reads a
          # success message closely.
          logs = sorted(glob.glob("store/logs/*.jsonl"))
          if not logs:
              print("No run log was written.")
              raise SystemExit
          with open(logs[-1], encoding="utf-8") as handle:
              last = json.loads(handle.readlines()[-1])
          lines = [
              f"Started:  {last.get('started_at')}",
              f"Finished: {last.get('finished_at')}",
              f"Listings tracked: {last.get('total_listings')}",
              f"Observations written this run: {last.get('total_observations_written')}",
              "",
              "| source | fetched | new | updated | swept fully | stopped early |",
              "|---|---|---|---|---|---|",
          ]
          for name, stats in (last.get("sources") or {}).items():
              lines.append(
                  f"| {name} | {stats.get('fetched')} | {stats.get('new')} | "
                  f"{stats.get('updated')} | {stats.get('run_complete')} | "
                  f"{len(stats.get('interruptions') or [])} |"
              )
          budget = last.get("budget") or {}
          lines += ["", f"Time used: {budget.get('elapsed_s')}s of {budget.get('max_seconds')}s"]
          print("\n".join(lines))
          PY
          )
          BODY=$(printf '%s\n\n%s\n\n[Run log](%s)\n\n%s\n' \
            "The scrape finished successfully." "$SUMMARY" "$RUN_URL" \
            "_Close this issue to acknowledge it. While it is open no further success notifications are sent; the next success after you close it opens a new one._")
          gh issue create \
            --title "Scrape succeeded - $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "$BODY" \
            --label "$LABEL" \
            --repo "$GITHUB_REPOSITORY" || echo "could not open the confirmation issue"

      - name: Fail job if the scrape reported errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "run.py exited non-zero this run (see the 'Run scraper' step log and logs/*.jsonl for details)."
          echo "Failing the job on purpose so GitHub's built-in workflow-failure email fires."
          exit 1
