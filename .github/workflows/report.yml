name: Weekly report

# The report is written once a week, not once an hour.
#
# The CSV series underneath it keeps updating every run - that is the record,
# and it has to be current. But the report is the page a person reads, and a
# page that changes hourly in a market that turns over in months is a page
# that trains you to ignore it. Weekly matches the slowest thing it measures.
#
# Monday 06:00 UTC = 08:00 Prague: after the Sunday rent pass and its backup,
# so the week's report is the first thing about a complete week.

on:
  schedule:
    # Monday, with Tuesday as the retry - and both in the small hours, when
    # the nightly city-wide pass has just finished and the dataset for the
    # week is complete.
    #
    # GitHub cron is UTC-only. 00:00 Monday UTC is 02:00 Prague in summer and
    # 01:00 in winter, and either way it is the first moment the week is
    # actually over: the dataset's days are Prague days, so a report at
    # midnight Prague would find Sunday still open and cover a week ending
    # Saturday. Two hours later costs nothing and gets the whole week.
    #
    # Tuesday is not a second edition. Both days ask for the week that ended
    # on Sunday and write the same file, so Tuesday finishes Monday's job if
    # Monday produced nothing and stops in seconds if it did.
    - cron: "*/15 0 * * 1,2"
  workflow_dispatch:

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATA_REPO: ZMAN-91/prague_reality_sector_analysis
  DATA_BRANCH: claude/real-estate-market-scraper-1tgiei

jobs:
  due:
    # Asks REPORT.md when it was last written. The scrape guard tells a real
    # run from a refusal by duration; here those are thirty seconds and
    # fifteen, and a rule with that little daylight would one day call a real
    # run a refusal and stop the report for good.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Checkout the dataset
        uses: actions/checkout@v4
        with:
          repository: ZMAN-91/prague_reality_sector_analysis
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          ref: claude/real-estate-market-scraper-1tgiei
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Has this week's report already been written?
        id: check
        run: python -m tools.report_due --data-dir store/data >> "$GITHUB_OUTPUT"

  report:
    needs: due
    if: needs.due.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Checkout the dataset
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          ref: ${{ env.DATA_BRANCH }}
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Re-examine the coordinates borrowed earlier
        # Once a week, every coordinate borrowed from a sreality advert is
        # matched again against that day's adverts.
        #
        # A pair, once made, was otherwise never looked at again - the daily
        # run skips any row that already has coordinates. That is right for
        # the common case and wrong for the failure case: where exactly one
        # candidate matched and it was the wrong flat, the row keeps a wrong
        # coordinate for ever, and a wrong coordinate quietly becomes a wrong
        # house number.
        #
        # Here rather than in the archive workflow itself, which lives in the
        # data repository and should not be making network calls to a portal.
        # The archive runs an hour after this one, so what it stores is the
        # re-examined data - which is the point of doing it weekly at all.
        #
        # Never fails the report: a portal that is unreachable this morning
        # is a reason to keep last week's coordinates, not to lose the week's
        # report.
        continue-on-error: true
        env:
          SCRAPER_ROBOTS_OVERRIDE_HOSTS: "www.sreality.cz"
        run: |
          python -m tools.lend_gps_from_sreality \
            --data-dir store/data --repair --apply

      - name: Fill house numbers for anything the re-examination moved
        # A moved coordinate has its number cleared, because the old one
        # named a building the row no longer points at. This puts the new one
        # on before the archive is taken.
        continue-on-error: true
        run: python -m tools.backfill_cislo --data-dir store/data --apply

      - name: Rebuild the series and the report
        # The whole chain, not just the last step: the report must never be
        # about whenever the CSVs happened to last be written. Recomputing
        # from listings.csv and the logs takes seconds and removes the
        # question entirely.
        run: |
          python -m tools.episodes --data-dir store/data
          python -m tools.market   --data-dir store/data
          python -m tools.report   --data-dir store/data

      - name: Commit the report
        env:
          DATA_ROOT: store
        run: bash tools/commit_data.sh "${DATA_BRANCH}" "Weekly report"

      - name: Summarise
        run: |
          {
            echo "## Weekly report"
            echo
            head -5 store/REPORT.md
          } >> "${GITHUB_STEP_SUMMARY}"
