name: Nightly city-wide scrape

on:
  schedule:
    # The small hours, every day. GitHub cron is UTC-only and has no notion
    # of a timezone, so this window is chosen to sit inside the night in both
    # halves of the year: 00:00-02:45 UTC is 02:00-04:45 Prague in summer and
    # 01:00-03:45 in winter.
    #
    # The waker does it properly - it computes the window in Europe/Prague
    # and stays correct across the switch-over. These crons are the fallback
    # for when it does not fire at all.
    #
    # The end of the window is what matters most. An attempt lands at :45 of
    # the last hour and then runs its whole budget, so 02:45 plus 90 minutes
    # is 04:15 UTC - before the hourly area passes resume in earnest, and
    # well clear of the report and backup at 00:00 Monday. Measured, the pass
    # itself is about an hour: the hourly city-wide sale walk takes 2187s and
    # the city-wide rent walk 1385s, and this one drops sreality from both.
    - cron: "*/15 0-2 * * *"
  workflow_dispatch:
    inputs:
      transactions:
        # Rent only. Sale runs hourly from scrape.yml with a different scope,
        # so the two never share a run.
        description: "Transaction types (prodej / pronajem)"
        required: false
        default: "prodej,pronajem"
      sources:
        # Order matters and is deliberate: sreality first (the watched area,
        # ~35 requests), then iDNES (a few hundred), then bezrealitky, which
        # is by far the largest and therefore the one that should be the one
        # cut short when the hour runs out. Sources are run in the order given.
        # No sreality. The hourly pass already reads it, narrowed to the
        # watched districts, and a city-wide sreality walk is the one thing
        # this project has never done at any cadence: its robots.txt
        # disallows everything, so the traffic it does take stays as small as
        # the question allows.
        description: "Comma-separated sources to run, in the order they run"
        required: false
        default: "idnes,bezrealitky"
      max_seconds:
        # Two hours for a pass measured at 59 minutes. This is city-wide
        # across all three sources and gets one attempt a week, so a run cut
        # short waits seven days for the remainder - the opposite of the
        # hourly case, where being cut short costs an hour. The slack is the
        # point; what caps it is that a pass starting at the end of the
        # window must still be done before sale resumes at 05:00. See
        # tests/test_workflows.py, which holds the two to each other.
        description: "Wall-clock budget for fetching (seconds)"
        required: false
        default: "5400"
      notify_on_success:
        # See the "Announce a successful run" step: a success opens an issue
        # only when none is already open, so this input exists to silence
        # even that for a one-off run.
        description: "Set to false to stay quiet even if no confirmation issue is open"
        required: false
        default: "true"
      max_new_details:
        # Measured on the first real pass: 5245 rent listings found, 1500
        # details fetched, 2489 left without one because this cap ran out
        # first - and the pass is weekly, so each of those waits seven days
        # for its turn. At 1500 the backlog takes four weeks to clear.
        #
        # What caps the cap is the fetching budget. That pass used 4254s of
        # 5400, of which about 1500 were the details themselves (one a
        # second), so the sweep alone is roughly 2750s. 3000 details puts the
        # pass near 5750s against a 7200s budget - a real margin, and the
        # backlog gone in two weeks instead of four.
        description: "Cap on one-time detail fetches for newly-seen listings"
        required: false
        default: "3000"
      as_schedule:
        # Set this whenever something OTHER THAN A PERSON presses the button.
        # The waker fires every fifteen minutes through the Sunday window;
        # without this each firing would start a four-hour city-wide pass.
        description: "Rate-limit this run through the guard (external wakers set this)"
        required: false
        default: "false"

permissions:
  contents: write
  # Only for the success notification below; nothing else in this workflow
  # touches issues.
  issues: write
  # The guard job reads this repository's own run history.
  actions: read

jobs:
  guard:
    # Two questions, and the pass starts only if both say yes.
    #
    #   1. Is the week's rent already in the dataset? (tools/rent_due.py)
    #   2. Is anything running, and did an attempt already start a pass in the
    #      last fifty minutes? (tools/scrape_guard.sh, as for the sale sweep)
    #
    # The first is what rations a weekly job; the second only stops attempts
    # from piling onto each other. It used to be the other way round - a
    # six-day floor on the run history and nothing else - and that lost the
    # first Sunday it was asked to work: the floor measured from a manual test
    # run on the Wednesday, 3.7 days back, and stopped the pass in ten
    # seconds. A run that left no rent behind in a dataset that has since been
    # rebuilt cannot be what decides the week is done. See tools/rent_due.py.
    #
    # Outside the concurrency group on purpose - it has to be able to answer
    # "something is already running" while that something runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go == 'true' && steps.week.outputs.go == 'true' }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Checkout the run log
        # Only logs/, and only the newest commit: the question is which days
        # already hold a city-wide pass, and this runs at every attempt in
        # the window.
        uses: actions/checkout@v4
        with:
          repository: ZMAN-91/prague_reality_sector_analysis
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          ref: claude/real-estate-market-scraper-1tgiei
          path: store
          sparse-checkout: logs
          sparse-checkout-cone-mode: false

      - name: Has the city already been walked today?
        id: week
        run: python3 -m tools.night_due --logs-dir store/logs >> "$GITHUB_OUTPUT"

      - name: Decide whether this attempt should scrape
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.as_schedule == 'true') && 'schedule' || github.event_name }}
          # Measure THIS workflow, not the hourly sale one - otherwise every
          # attempt would see a sale sweep from minutes ago and never run.
          MEASURE_WORKFLOW: scrape-night.yml
          # Fifty minutes. What keeps this pass daily is night_due.py; the
          # floor only stops a pass that died before committing from being
          # retried at every attempt for the rest of the window.
          MIN_GAP_MINUTES: "50"
          MIN_REAL_RUN_SECONDS: "300"
        run: tools/scrape_guard.sh >> "$GITHUB_OUTPUT"

  scrape:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # One group for BOTH workflows. This pass writes the same listings.csv as
    # the hourly sale run, so they must never overlap - two runs merging into
    # the same file would race and one would lose its work.
    concurrency:
      group: scrape-data
      cancel-in-progress: false
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Checkout the dataset
        # The data lives in a private repository so it is never published;
        # the code lives here so the Actions minutes are free. A deploy key
        # with write access joins the two - see docs/rozdeleni.md.
        uses: actions/checkout@v4
        with:
          repository: ZMAN-91/prague_reality_sector_analysis
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          ref: claude/real-estate-market-scraper-1tgiei
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # A scraper that writes to a committed dataset should not run at all
        # if its own parsing/merging logic is broken - the tests are offline
        # and take under a second.
        run: python -m pytest -q

      - name: Run scraper
        id: scrape
        # Never let a non-zero exit skip the commit step below: whatever
        # data/log output run.py produced before failing must still be
        # persisted. The job is still failed deliberately at the end (see
        # "Fail job if scrape reported errors").
        continue-on-error: true
        env:
          SOURCES: ${{ github.event.inputs.sources || 'idnes,bezrealitky' }}
          MAX_SECONDS: ${{ github.event.inputs.max_seconds || '5400' }}
          MAX_NEW_DETAILS: ${{ github.event.inputs.max_new_details || '3000' }}
          TRANSACTIONS: ${{ github.event.inputs.transactions || 'prodej,pronajem' }}
          # ------------------------------------------------------------------
          # THE ONE PLACE where this project stops treating a robots.txt as
          # binding. Delete this line and strict compliance returns everywhere.
          #
          # Why only sreality: bezrealitky publishes a sitemap and permits its
          # listing detail pages, so it is collected entirely through the route
          # the site itself offers - no override needed, and none given. Its
          # GraphQL host (api.bezrealitky.cz, "Disallow: /") is not touched.
          #
          # Reality.iDNES.cz needs no override either: "Allow: /" with only
          # search-filter URL shapes disallowed, and VOP that are advertiser
          # billing terms. Realingo and CeskeReality are deliberately NOT
          # collected - realingo's terms forbid crawlers and scraping by
          # name, CeskeReality's robots.txt is "Disallow: /" - so the only
          # source this project overrides remains the one below.
          #
          # sreality has no such route: its robots.txt is "Disallow: /" for
          # every agent that is not one of eighteen named search engines, so
          # there is no compliant automated path to the data at all. This is an
          # informed operator decision for personal, non-commercial market
          # tracking with no redistribution, and it is paired with a footprint
          # deliberately kept near a person's: an honest self-identifying
          # User-Agent (no browser impersonation), 1-2s between requests, each
          # listing's detail fetched once ever, and - the big one - reading the
          # search index rather than one request per listing, which is the
          # difference between ~30 requests an hour and ~12,000.
          # See docs/robots/www.sreality.cz.robots.txt for the exact text.
          SCRAPER_ROBOTS_OVERRIDE_HOSTS: "www.sreality.cz"
        run: |
          python run.py \
            --sources "$SOURCES" \
            --scope city \
            --max-seconds "$MAX_SECONDS" \
            --max-new-details "$MAX_NEW_DETAILS" \
            --transactions "$TRANSACTIONS" \
            --data-dir store/data \
            --logs-dir store/logs

      - name: Borrow coordinates for iDNES listings from sreality
        # iDNES publishes no coordinates anywhere, and it is 64% of
        # everything collected. Without one a listing gets no house number,
        # no priority zone and no place on a map.
        #
        # sreality's search index carries them on every row, so this walks
        # Prague's index - about 25 requests at 500 rows a page, no detail
        # pages at all - and lends a coordinate to any iDNES row it can match
        # to the same flat. The adverts it reads are used and dropped, never
        # stored: sreality is collected for the watched area deliberately,
        # and storing a city's worth here would hand absence-marking a
        # population nothing ever walked.
        #
        # Daily, here, because this is the pass that has just collected the
        # night's new iDNES listings - so they are given coordinates in the
        # same morning rather than waiting for the next one.
        continue-on-error: true
        env:
          # Same single override as the scrape step above, for the same
          # single host, and for a smaller footprint than one hourly pass:
          # ~25 requests a day against the ~840 the hourly area passes
          # already make. See tools/lend_gps_from_sreality.py.
          SCRAPER_ROBOTS_OVERRIDE_HOSTS: "www.sreality.cz"
        run: |
          python -m tools.lend_gps_from_sreality \
            --data-dir store/data --apply

      - name: Fill house numbers for whatever just gained coordinates
        # A borrowed coordinate is only worth having if it is used. The
        # matcher is local and re-runnable, so this costs a second.
        continue-on-error: true
        run: |
          python -m tools.backfill_cislo --data-dir store/data --apply

      - name: Export human-readable CSV views
        # Cheap, offline, and makes the dataset browsable straight from the
        # repo without loading the full listings.csv.
        continue-on-error: true
        run: |
          python -m tools.export_csv --data-dir store/data
          python -m tools.episodes --data-dir store/data
          python -m tools.market --data-dir store/data

      - name: Commit and push data changes
        # The whole sequence lives in tools/commit_data.sh, which both
        # workflows call and tests/test_commit_step.py exercises against real
        # git repositories. It was inline and identical in both files, which
        # is how a bug that reverts code pushes survived in two places at
        # once. The script's header explains the two rules it enforces.
        env:
          DATA_ROOT: store
        run: bash tools/commit_data.sh "claude/real-estate-market-scraper-1tgiei" "Nightly city scrape"

      - name: Check the collection's health
        # Runs even when the scrape failed: a failed run still has something
        # to say about how long the silence before it was. Its own exit code
        # decides nothing here - "Fail job if the scrape reported errors"
        # below owns that - but a finding fails the job, and a failed job is
        # the only thing GitHub emails about without being asked.
        if: always() && steps.scrape.conclusion != 'skipped'
        run: python -m tools.health --data-dir store/data --logs-dir store/logs

      - name: Announce a successful run
        # GitHub emails you when a workflow FAILS; there is no built-in
        # notification for one that worked. So a successful run announces
        # itself by opening an issue, which the repository owner watches by
        # default and therefore receives by email.
        #
        # At most one such issue is open at a time. That is what keeps an
        # hourly schedule from becoming an hourly inbox: the first successful
        # run opens one, every run after that sees it and stays quiet. Close
        # the issue and the next success opens a fresh one - which is also
        # how you ask for another confirmation later.
        #
        # `notify_on_success: false` on a manual run suppresses it entirely.
        if: steps.scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY: ${{ github.event.inputs.notify_on_success }}
          # Its own label: sharing one with the hourly sale run would mean
          # an open sale confirmation silences the weekly rent one, and the
          # rent run is the one you hear from least often.
          LABEL: rent-scrape-ok
        run: |
          set -euo pipefail

          if [ "${NOTIFY:-}" = "false" ]; then
            echo "notify_on_success=false for this run; staying quiet."
            exit 0
          fi
          # Create the label first: `gh issue list --label` errors on a label
          # that does not exist, and under `set -e` that would fail the job
          # over a notification. Both calls are allowed to fail softly - a
          # missing confirmation must never turn a good run into a bad one.
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" \
            --description "Confirmation that a weekly rent scrape succeeded" \
            --color 0e8a16 >/dev/null 2>&1 || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --label "$LABEL" --limit 1 --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$OPEN" != "0" ]; then
            echo "A confirmation issue is already open; not opening another."
            exit 0
          fi

          # The numbers come from the run's own log, so the email says what
          # was collected rather than just that something happened.
          SUMMARY=$(python - <<'PY'
          import glob, json
          # store/, not logs/: the dataset is checked out into a
          # subdirectory now. Reading the old path found nothing and the
          # notification quietly said "No run log was written" - a green run
          # announcing itself with no numbers in it, which is exactly the
          # kind of half-working that survives because nobody reads a
          # success message closely.
          logs = sorted(glob.glob("store/logs/*.jsonl"))
          if not logs:
              print("No run log was written.")
              raise SystemExit
          with open(logs[-1], encoding="utf-8") as handle:
              last = json.loads(handle.readlines()[-1])
          lines = [
              f"Started:  {last.get('started_at')}",
              f"Finished: {last.get('finished_at')}",
              f"Listings tracked: {last.get('total_listings')}",
              f"Observations written this run: {last.get('total_observations_written')}",
              "",
              "| source | fetched | new | updated | swept fully | stopped early |",
              "|---|---|---|---|---|---|",
          ]
          for name, stats in (last.get("sources") or {}).items():
              lines.append(
                  f"| {name} | {stats.get('fetched')} | {stats.get('new')} | "
                  f"{stats.get('updated')} | {stats.get('run_complete')} | "
                  f"{len(stats.get('interruptions') or [])} |"
              )
          budget = last.get("budget") or {}
          lines += ["", f"Time used: {budget.get('elapsed_s')}s of {budget.get('max_seconds')}s"]
          print("\n".join(lines))
          PY
          )
          BODY=$(printf '%s\n\n%s\n\n[Run log](%s)\n\n%s\n' \
            "The weekly rent scrape finished successfully." "$SUMMARY" "$RUN_URL" \
            "_Close this issue to acknowledge it. While it is open no further success notifications are sent; the next success after you close it opens a new one._")
          gh issue create \
            --title "Rent scrape succeeded - $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "$BODY" \
            --label "$LABEL" \
            --repo "$GITHUB_REPOSITORY" || echo "could not open the confirmation issue"

      - name: Fail job if the scrape reported errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "run.py exited non-zero this run (see the 'Run scraper' step log and logs/*.jsonl for details)."
          echo "Failing the job on purpose so GitHub's built-in workflow-failure email fires."
          exit 1
