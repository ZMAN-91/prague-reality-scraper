name: Weekly data backup

# DEPLOYED FILE - the copy that runs lives in the private data repository at
# .github/workflows/backup.yml. This is the source of truth: edit it here,
# where the tests can see it, then copy it across. It cannot simply run from
# the public repository, because the release it publishes carries the whole
# dataset and so must be created somewhere private.

on:
  schedule:
    # Monday, with Tuesday as the retry - and both in the small hours, when
    # the nightly city-wide pass has just finished and the dataset for the
    # week is complete.
    #
    # GitHub cron is UTC-only. 00:00 Monday UTC is 02:00 Prague in summer and
    # 01:00 in winter, and either way it is the first moment the week is
    # actually over: the dataset's days are Prague days, so a report at
    # midnight Prague would find Sunday still open and cover a week ending
    # Saturday. Two hours later costs nothing and gets the whole week.
    #
    # Tuesday is not a second edition. Both days ask for the week that ended
    # on Sunday and write the same file, so Tuesday finishes Monday's job if
    # Monday produced nothing and stops in seconds if it did.
    #
    # An hour after the report, because the archive carries reports/ - taken
    # first it would hold every week's page except the one it is named after.
    - cron: "*/15 1 * * 1,2"
  workflow_dispatch:

# Only reads the repository; writes nothing back to the branch. The release
# is the artifact.
concurrency:
  group: weekly-backup
  cancel-in-progress: false

permissions:
  # Creating the release that holds the archive. Nothing here pushes a commit.
  contents: write

jobs:
  due:
    # The archive is idempotent - a second run for the same week reuploads
    # over the first - but sixteen attempts would mean sixteen archives built
    # and thrown away. This asks the releases whether the week is already
    # done, which is the archive's own record rather than a proxy for it.
    #
    # "Done" means published today, not merely tagged for this week. See
    # tools/backup_due.sh: a test release built on the Wednesday carried this
    # week's tag, and on its own the tag would have skipped the real archive
    # that Sunday and every Sunday after.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Checkout the code
        # Public repository, so no key - this needs one script.
        uses: actions/checkout@v4
        with:
          repository: ZMAN-91/prague-reality-scraper
          path: code

      - name: Has this week's archive already been published?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: code/tools/backup_due.sh >> "$GITHUB_OUTPUT"

  backup:
    needs: due
    if: needs.due.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the dataset
        uses: actions/checkout@v4

      - name: Checkout the code
        # Public, so no key is needed in this direction.
        uses: actions/checkout@v4
        with:
          repository: ZMAN-91/prague-reality-scraper
          path: code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r code/requirements-dev.txt

      - name: Run tests
        # The backup tool verifies its own output, so a broken verifier is the
        # one bug that could turn a bad archive into a green job.
        run: python -m pytest -q
        working-directory: code

      - name: Build and verify the archive
        id: backup
        # Builds the .tar.gz, then restores it to a temporary directory,
        # re-hashes every file against the manifest and reads listings.csv
        # back through the project's own loader. A non-zero exit here fails
        # the job rather than uploading something unverified.
        run: python -m tools.backup --root "${GITHUB_WORKSPACE}" --out "${GITHUB_WORKSPACE}/backup" --github-output
        working-directory: code

      - name: Publish the archive as a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: backup-${{ steps.backup.outputs.week }}
          ARCHIVE: ${{ steps.backup.outputs.archive }}
          WEEK: ${{ steps.backup.outputs.week }}
          LISTINGS: ${{ steps.backup.outputs.listings }}
          OBSERVATIONS: ${{ steps.backup.outputs.observations }}
        run: |
          set -euo pipefail
          MANIFEST="backup/prague-reality-${WEEK}.manifest.json"

          # A release, not an Actions artifact: artifacts expire after 90 days
          # at most, which makes them a transfer mechanism rather than a
          # backup. Release assets stay until someone deletes them, and they
          # do not enlarge the clone the way committing the archive would.
          cat > notes.md <<EOF
          Dataset snapshot for ISO week ${WEEK}, taken from commit ${GITHUB_SHA}.

          * ${LISTINGS} listings
          * ${OBSERVATIONS} observations
          * Built and verified by \`tools/backup.py\` - the archive was
            restored to a temporary directory and every file re-hashed against
            the manifest before this release was created.

          Restore into a checkout:

          \`\`\`
          tar xzf $(basename "${ARCHIVE}") --strip-components=1 -C /path/to/repo
          \`\`\`

          Check it first:

          \`\`\`
          python -m tools.backup --verify $(basename "${ARCHIVE}")
          \`\`\`

          Holds the dataset (listings, observations, state, progress and the
          browsable views in \`data/csv/\`). Does **not** hold \`data/raw/\`,
          the archive of the portals' raw HTTP responses - that is append-only
          and lives in git history. See \`tools/backup.py\` for the reasoning.
          EOF

          # Re-running the workflow for a week that already has a release
          # replaces its assets rather than failing.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" "${MANIFEST}" --clobber
            gh release edit "${TAG}" --notes-file notes.md --target "${GITHUB_SHA}"
          else
            gh release create "${TAG}" "${ARCHIVE}" "${MANIFEST}" \
              --target "${GITHUB_SHA}" \
              --title "Data backup ${WEEK}" \
              --notes-file notes.md
          fi

      - name: Summarise
        if: always()
        env:
          WEEK: ${{ steps.backup.outputs.week }}
          LISTINGS: ${{ steps.backup.outputs.listings }}
          OBSERVATIONS: ${{ steps.backup.outputs.observations }}
          BYTES: ${{ steps.backup.outputs.bytes }}
        run: |
          {
            echo "## Weekly backup ${WEEK:-(not built)}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| listings | ${LISTINGS:-—} |"
            echo "| observations | ${OBSERVATIONS:-—} |"
            echo "| archive size | ${BYTES:-—} bytes |"
            echo "| commit | ${GITHUB_SHA} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # No success notification. A backup that runs every week would make the
      # confirmation the noise and the failure the thing you stop reading;
      # GitHub's own e-mail on a failed scheduled run is the signal that
      # matters, and it is the same mechanism the scrape workflows use.
