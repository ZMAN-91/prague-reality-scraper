[pytest]
# The dataset is checked out INTO this tree, at store/, so a bare
# `python -m pytest` would collect store/tests/ as well as tests/ - and since
# the module names are identical, pytest refuses the lot with 28 collection
# errors rather than running anything. That is how the first split run failed.
#
# Pinning testpaths also means the gate in front of the scraper keeps working
# whatever ends up under store/ later.
testpaths = tests
norecursedirs = store .venv .git data logs backup docs *.egg-info
